<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Colon Emoji</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Colon Emoji</h1>
    <label class="toggle">
      <span>Enabled</span>
      <input type="checkbox" id="enabled" />
    </label>
    <label class="toggle" id="site-row" hidden>
      <span>On <b id="site"></b></span>
      <input type="checkbox" id="site-enabled" />
    </label>
    <p>Type <code>:smile:</code> or start with <code>:sm</code> and pick from the menu.</p>
    <script src="../src/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
